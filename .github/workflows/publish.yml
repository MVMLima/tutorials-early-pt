name: Render e publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27

      # O site é renderizado a partir do cache em `_freeze/` (commitado no repositório),
      # por isso o build não precisa do R nem dos pacotes do Epiverse no CI.
      # `-M execute.freeze=true` força o uso do cache mesmo quando um .qmd é editado:
      # sem isso, editar só o TEXTO de um episódio (direto no GitHub) faria o CI tentar
      # reexecutar o código R e falhar, porque os pacotes não existem no runner.
      # Regra: mudou CÓDIGO R -> rode `quarto render` localmente e commite o _freeze/ junto.
      - name: Renderizar o site
        run: quarto render -M execute.freeze=true

      - name: Publicar no GitHub Pages (branch gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
